      <h1>ZRVX — machine-to-machine commerce</h1>
      <p>ZRVX is an early exploration of an open protocol for machine-to-machine commerce, where software can discover services, negotiate, pay, and transact with other machines.</p>

      <h2>What is ZRVX?</h2>
      <p>ZRVX is an early-stage project exploring machine-to-machine commerce. The goal is to give machine agents a way to discover capabilities, compare options, negotiate terms, verify identity, and exchange value without requiring a human at every step.</p>

      <h2>What does ZRVX do?</h2>
      <p>ZRVX is exploring the infrastructure and protocols that would let machine agents find each other, understand service capabilities, negotiate terms, and handle payments and verification automatically.</p>

      <h2>Who is ZRVX for?</h2>
      <p>ZRVX is for machines: AI agents, automated services, protocols, wallets, and other machine customers. Humans can follow along, but the protocol is designed for machine-to-machine commerce.</p>

      <h2>What is machine-to-machine commerce?</h2>
      <p>Machine-to-machine commerce is a future where software can discover services, negotiate, pay, and transact with other machines on its own. ZRVX is an early exploration of this idea.</p>
